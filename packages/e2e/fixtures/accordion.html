<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Accordion — Hydrateless E2E</title>
    <link rel="stylesheet" href="/packages/hydrateless/dist/hydrateless.css" />
  </head>
  <body>
    <main>
      <h1>Accordion</h1>
      <div data-hl-accordion>
        <details data-hl-value="shipping">
          <summary id="a1">Shipping</summary>
          <div class="hl-accordion-panel">Ships in 2 to 3 business days.</div>
        </details>
        <details data-hl-value="returns">
          <summary id="a2">Returns</summary>
          <div class="hl-accordion-panel">Free returns within 30 days.</div>
        </details>
        <details data-hl-value="warranty">
          <summary id="a3">Warranty</summary>
          <div class="hl-accordion-panel">Two-year limited warranty.</div>
        </details>
      </div>
      <p id="result" aria-live="polite"></p>
    </main>
    <script type="module" src="/packages/e2e/fixtures/boot.js"></script>
    <script type="module">
      document.addEventListener('hl:change', (event) => {
        document.getElementById('result').textContent = `value:${event.detail.value.join(',')}`;
      });
    </script>
  </body>
</html>
