<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Command — Hydrateless E2E</title>
    <link rel="stylesheet" href="/packages/hydrateless/dist/hydrateless.css" />
  </head>
  <body>
    <main>
      <h1>Command palette</h1>
      <div data-hl-command>
        <input
          id="cmd-input"
          data-hl-command-input
          class="hl-input"
          aria-label="Search commands"
          placeholder="Type a command…"
        />
        <div data-hl-command-empty hidden>No results found.</div>
        <div data-hl-command-list role="listbox" aria-label="Commands">
          <div data-hl-command-group role="group" aria-label="General">
            <div
              role="option"
              aria-selected="false"
              data-hl-value="new-file"
              data-hl-keywords="create"
            >
              New file
            </div>
            <div role="option" aria-selected="false" data-hl-value="open-file">Open file</div>
            <div
              role="option"
              aria-selected="false"
              data-hl-value="toggle-theme"
              data-hl-keywords="dark light"
            >
              Toggle theme
            </div>
          </div>
        </div>
      </div>
      <p id="result" aria-live="polite"></p>
    </main>
    <script type="module" src="/packages/e2e/fixtures/boot.js"></script>
    <script type="module">
      document.addEventListener('hl:command', (event) => {
        document.getElementById('result').textContent = `ran:${event.detail.value}`;
      });
    </script>
  </body>
</html>
