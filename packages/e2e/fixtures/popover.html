<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Popover | Hydrateless E2E</title>
    <link rel="stylesheet" href="/packages/hydrateless/dist/hydrateless.css" />
  </head>
  <body>
    <main>
      <h1>Popover</h1>
      <button id="trigger" popovertarget="pop">Account</button>

      <div id="pop" data-hl-popover popover="auto" role="dialog" aria-label="Account menu">
        <p>Signed in as Alex.</p>
        <a id="profile" href="#profile">View profile</a>
        <button id="signout" type="button">Sign out</button>
      </div>
    </main>
    <script type="module" src="/packages/e2e/fixtures/boot.js"></script>
  </body>
</html>
