<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Segmented control | Hydrateless E2E</title>
    <link rel="stylesheet" href="/packages/hydrateless/dist/hydrateless.css" />
  </head>
  <body>
    <main>
      <h1>Segmented control</h1>
      <!-- Radio segments: native keyboard and selection; the enhancer only reports. -->
      <div class="hl-segmented" role="radiogroup" aria-label="View" data-hl-segmented id="radios">
        <label class="hl-segmented-item">
          <input type="radio" name="view" value="list" checked />
          <span>List</span>
        </label>
        <label class="hl-segmented-item">
          <input type="radio" name="view" value="grid" />
          <span>Grid</span>
        </label>
        <label class="hl-segmented-item">
          <input type="radio" name="view" value="map" />
          <span>Map</span>
        </label>
      </div>
      <!-- Button segments: the enhancer supplies the radio-group semantics. -->
      <div class="hl-segmented" aria-label="Period" data-hl-segmented id="buttons">
        <button type="button" class="hl-segmented-item" data-hl-value="day" aria-pressed="true">
          Day
        </button>
        <button type="button" class="hl-segmented-item" data-hl-value="week">Week</button>
        <button type="button" class="hl-segmented-item" data-hl-value="month">Month</button>
      </div>
      <p id="result" aria-live="polite"></p>
    </main>
    <script type="module" src="/packages/e2e/fixtures/boot.js"></script>
    <script type="module">
      document.addEventListener('hl:change', (event) => {
        document.getElementById('result').textContent = `${event.target.id}:${event.detail.value}`;
      });
    </script>
  </body>
</html>
