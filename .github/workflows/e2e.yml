name: E2E

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  e2e:
    name: Playwright (real browsers + axe)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Fixtures load the published CSS bundle and the CDN auto bundle by path,
      # so the dist output has to exist before the suite runs.
      - name: Build packages
        run: npm run build
      - name: Install Playwright browsers
        working-directory: packages/e2e
        run: npx playwright install --with-deps
      - name: Run E2E (Chromium, Firefox, WebKit)
        working-directory: packages/e2e
        run: npx playwright test
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/e2e/playwright-report
          retention-days: 7
