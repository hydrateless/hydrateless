name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    name: Lint, Format, Build, Typecheck, Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Lint CSS
        run: npm run lint:css
      - name: Format check
        run: npm run format:check
      - name: Build
        run: npm run build
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Size limit
        run: npm run size

  e2e:
    name: E2E (Playwright + axe)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Fixtures load the published CSS bundle and the CDN auto bundle by path,
      # so the dist output has to exist before the suite runs. Rebuilding here
      # is cheaper than shipping artifacts out of the Node matrix above.
      - name: Build packages
        run: npm run build
      # All three engines: the no-JS baseline and the enhanced experience are
      # both promised to work across Chromium, Firefox, and WebKit.
      - name: Install Playwright browsers
        working-directory: packages/e2e
        run: npx playwright install --with-deps
      - name: Run E2E
        working-directory: packages/e2e
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/e2e/playwright-report
          retention-days: 7

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Build-only validation of the docs site (packages + TypeDoc + VitePress)
      # so a broken build (such as invalid YAML frontmatter) fails the PR before
      # merge. Building and deploying on push to main stays in docs.yml. This
      # mirrors the deploy build, which serves from the root of hydrateless.com.
      - name: Build docs (packages + TypeDoc + VitePress)
        run: npm run docs:build
